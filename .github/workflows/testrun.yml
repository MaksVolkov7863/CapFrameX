# Builds a portable zip of this test branch and publishes it as a prerelease.
# This workflow stays on the testRun branch and is not part of the upstream pull request.

name: Test run zip

on:
  workflow_dispatch:
  push:
    branches:
      - testRun

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      PLATFORM: x64
      VS_VERSION: 18.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0, 19.0)'

      - name: Install Visual Studio Native Desktop + MFC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          if (-not (Test-Path $vsInstaller)) { throw "vs_installer.exe not found at $vsInstaller" }
          $instance = (& $vswhere -latest -products * -version "[18.0, 19.0)" -requires Microsoft.Component.MSBuild -format json | ConvertFrom-Json | Select-Object -First 1)
          if ($null -eq $instance) { throw "No Visual Studio installation found on runner." }
          $installPath = $instance.installationPath
          $beforeMfc = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          $net472 = Join-Path "${env:ProgramFiles(x86)}" "Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2\mscorlib.dll"
          $atlmfc = Get-ChildItem -Path (Join-Path $installPath "VC\Tools\MSVC") -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "atlmfc\lib\x64" } | Where-Object { Test-Path $_ }
          $mfcLibs = @()
          if ($atlmfc) { $mfcLibs = @(Get-ChildItem -Path $atlmfc -Filter "mfc*.lib" -ErrorAction SilentlyContinue) }
          if ([string]::IsNullOrWhiteSpace($beforeMfc) -or ($mfcLibs.Count -eq 0) -or -not (Test-Path $net472)) {
            $proc = Start-Process -FilePath $vsInstaller -ArgumentList @(
              "modify", "--installPath", "$installPath",
              "--add", "Microsoft.VisualStudio.Workload.NativeDesktop",
              "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
              "--add", "Microsoft.Net.Component.4.7.2.TargetingPack",
              "--add", "Microsoft.Net.Component.4.7.2.SDK",
              "--passive", "--norestart", "--wait"
            ) -Wait -PassThru -NoNewWindow
            if (($proc.ExitCode -ne 0) -and ($proc.ExitCode -ne 3010)) {
              throw "Failed to install Native Desktop/MFC components. Exit code: $($proc.ExitCode)"
            }
          }

      - name: Restore
        shell: cmd
        run: nuget restore CapFrameX.sln

      - name: Build CapFrameX
        shell: cmd
        run: msbuild source\CapFrameX\CapFrameX.csproj /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:DeployOnBuild=true /p:VisualStudioVersion=%VS_VERSION%

      - name: Build native helpers
        shell: cmd
        run: |
          msbuild source\CapFrameX.Hwinfo\CapFrameX.Hwinfo.vcxproj /p:SolutionDir="%GITHUB_WORKSPACE%\\" /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:DeployOnBuild=true /p:VisualStudioVersion=%VS_VERSION%
          msbuild source\CapFrameX.IGCL\CapFrameX.IGCL.vcxproj /p:SolutionDir="%GITHUB_WORKSPACE%\\" /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:DeployOnBuild=true /p:VisualStudioVersion=%VS_VERSION%
          msbuild source\CapFrameX.ADLX\CapFrameX.ADLX.vcxproj /p:SolutionDir="%GITHUB_WORKSPACE%\\" /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:DeployOnBuild=true /p:VisualStudioVersion=%VS_VERSION%

      - name: Stage portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "source\CapFrameX\bin\x64\Release\net10.0-windows"
          $native = Join-Path $env:GITHUB_WORKSPACE "source\CapFrameX\bin\x64\Release"
          foreach ($dll in @("CapFrameX.Hwinfo.dll", "CapFrameX.IGCL.dll", "CapFrameX.ADLX.dll")) {
            Copy-Item -LiteralPath (Join-Path $native $dll) -Destination (Join-Path $out $dll) -Force
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "portable.json.sample") -Destination (Join-Path $out "portable.json") -Force
          if (-not (Test-Path -LiteralPath (Join-Path $out "CapFrameX.exe"))) { throw "CapFrameX.exe was not produced." }

      - name: Create portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "version\Version.txt" -Raw).Trim()
          $zip = Join-Path $env:GITHUB_WORKSPACE "CapFrameX-$version-testrun.zip"
          Compress-Archive -Path "source\CapFrameX\bin\x64\Release\net10.0-windows\*" -DestinationPath $zip -Force

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content "version\Version.txt" -Raw).Trim()
          $zip = Join-Path $env:GITHUB_WORKSPACE "CapFrameX-$version-testrun.zip"
          $tag = "testrun"
          $notes = @(
            "Portable test build of the localization branch."
            ""
            "Interface language and OSD language are separate settings under Settings, Application."
            "Extract the zip and run CapFrameX.exe. portable.json is already next to the executable."
            "Requires the .NET 10 Desktop Runtime (x64)."
          ) -join "`n"
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $zip --prerelease --target "${{ github.sha }}" --title "CapFrameX $version translation test" --notes $notes
